name: Health check

# On-demand probe of the live site from a GitHub runner.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sunrise.mtirop.com
        run: |
          for url in "https://sunrise.mtirop.com/" \
                     "https://sunrise.mtirop.com/services/" \
                     "https://sunrise.mtirop.com/team/" \
                     "https://sunrise.mtirop.com/admin/login/" \
                     "http://sunrise.mtirop.com/"; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo ERR)
            echo "$url -> $code"
          done
          main=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "https://sunrise.mtirop.com/")
          [ "$main" = "200" ] || { echo "::error::Homepage is not 200 (got $main)"; exit 1; }
          curl -sk --max-time 20 "https://sunrise.mtirop.com/" | grep -o "<title>[^<]*" | head -1
