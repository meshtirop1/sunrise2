name: Server setup

# One-click server preparation for sunrise.mtirop.com.
# Idempotent: safe to run again at any time.
# Run from the Actions tab ("Run workflow") once the VPS_* secrets are set.

on:
  workflow_dispatch:

jobs:
  setup:
    name: Prepare VPS
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::error::VPS_HOST / VPS_USER / VPS_SSH_KEY secrets must be set first (repo Settings -> Secrets -> Actions)."
            exit 1
          fi

      - name: Prepare server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          # Keep this script free of inline if/else: drone-ssh `script_stop` can
          # abort on a negated test that takes the else branch. All conditional
          # logic lives in deploy/server-setup.sh, run below as one bash command.
          script: |
            set -e
            cd /home/deploy/sites/sunrise
            git config --global --add safe.directory /home/deploy/sites/sunrise || true
            git fetch origin main
            git reset --hard origin/main
            bash deploy/server-setup.sh
