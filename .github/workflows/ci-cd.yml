name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Collect static files (sanity)
        run: python manage.py collectstatic --noinput

      - name: Production settings check
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: ci-only-dummy-key-not-used-in-production
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level ERROR

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Check deploy secrets are configured
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS_HOST secret not set - skipping deployment. See DEPLOYMENT.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd /srv/sunrise/app
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh

      - name: Verify site is up
        if: steps.secrets.outputs.configured == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE_URL")
            echo "Health check: $SITE_URL -> HTTP $code"
            [ "$code" = "200" ] || exit 1
          else
            echo "SITE_URL secret not set - skipping health check."
          fi
