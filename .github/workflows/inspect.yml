name: Inspect live page

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Page path to inspect (e.g. /services/)"
        default: "/"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump page structure and test images
        run: |
          P="${{ github.event.inputs.path }}"
          curl -sk "https://sunrise.mtirop.com$P" -o page.html
          echo "===== SECTIONS ====="
          grep -o '<section class="[^"]*"' page.html
          echo "===== HEADINGS ====="
          grep -oE '<h[12][^>]*>[^<]*' page.html
          echo "===== IMAGE CHECKS ====="
          grep -o 'src="[^"]*"' page.html | sed 's/src="//;s/"//' | sort -u | while read u; do
            case "$u" in
              /*) full="https://sunrise.mtirop.com$u";;
              http*) full="$u";;
              *) full="https://sunrise.mtirop.com/$u";;
            esac
            code=$(curl -sk -o /dev/null -w "%{http_code} %{size_download}b" --max-time 15 "$full")
            echo "$code  $u"
          done
          echo "===== PAGE SIZE ====="
          wc -c page.html
