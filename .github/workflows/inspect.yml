name: Inspect live page

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump Our Services section and test images
        run: |
          curl -sk https://sunrise.mtirop.com/ -o home.html
          echo "===== SERVICES SECTION HTML ====="
          sed -n '/services-preview/,/home-about/p' home.html
          echo "===== IMAGE URL CHECKS ====="
          grep -o 'src="[^"]*"' home.html | sed 's/src="//;s/"//' | sort -u | while read u; do
            case "$u" in
              /*) full="https://sunrise.mtirop.com$u";;
              http*) full="$u";;
              *) full="https://sunrise.mtirop.com/$u";;
            esac
            code=$(curl -sk -o /dev/null -w "%{http_code} %{size_download}b %{content_type}" --max-time 15 "$full")
            echo "$code  $u"
          done
          echo "===== STATS + ABOUT SECTIONS PRESENT? ====="
          grep -c "stats-strip" home.html || true
          grep -c "home-about" home.html || true
