# Nginx site for Sunrise Drilling (sunrise.mtirop.com).
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sunrise
#          sudo ln -sf /etc/nginx/sites-available/sunrise /etc/nginx/sites-enabled/sunrise
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d sunrise.mtirop.com   (certbot edits this file)

server {
    listen 80;
    server_name sunrise.mtirop.com;

    client_max_body_size 25M;

    # Static files collected by `manage.py collectstatic`
    location /static/ {
        alias /home/deploy/sites/sunrise/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded media — lives OUTSIDE the repo so deploys never touch it
    location /media/ {
        alias /home/deploy/sites/sunrise-data/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
