# Nginx site for Sunrise Drilling.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sunrise
#          sudo ln -s /etc/nginx/sites-available/sunrise /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then get HTTPS with: sudo certbot --nginx -d sunrisedrillingltd.com -d www.sunrisedrillingltd.com

server {
    listen 80;
    server_name sunrisedrillingltd.com www.sunrisedrillingltd.com;

    client_max_body_size 20M;

    # Static files collected by `manage.py collectstatic`
    location /static/ {
        alias /srv/sunrise/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media (lives outside the repo, survives deploys)
    location /media/ {
        alias /srv/sunrise/data/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/srv/sunrise/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
